runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 12

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: 'pnpm'
        cache-dependency-path: 'pnpm-lock.yaml'

    - name: Install dependencies
      run: pnpm install
      shell: bash
